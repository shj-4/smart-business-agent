[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E501 (طول السطر) مكتوم — الأسطر العربية الطويلة مقصودة؛ القواعد المنطقية فعّالة
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# ملفات التشغيل/البرامج النصية تُغفر لها الصيانات المتساهلة
"scripts/*.py" = ["E", "W"]
"*.pyi" = ["E", "W"]

[tool.ruff.lint.isort]
known-first-party = ["app", "bot"]